; Profil du coeur hote fbneo_ghosts pour DoDonPachi Dai-Ou-Jou Black Label (set ddpdojblka, IGS PGM, 68000), mode TRAINING.
; Identite = crc32 de la liste triee des crc32 des fichiers du .zip (ddb_1dot.u45 265f26cd, ddp3blk_defaults.nv a1651904) : be7be29b.
; A poser dans <systeme>\nelfeplay\profils\be7be29b.ini. Adresses = offsets du bloc SYSTEM_RAM de FBNeo (memoire du 68000
; 0x800000-0x81FFFF), mots lus en u16le comme le .MEM du jeu (inverse=0). Banc du 25/11 (dev-natif, fbneo_ghosts TRAINING).
[profil]
nom=DoDonPachi Dai-Ou-Jou Black Label (ddpdojblka)
; le stage 0xD56C et la version 0x3810 (0 = VERSION-A White Label, 1 = VERSION-B Black Label) : un fantome n'est dessine que
; dans le meme stage et la meme version que le joueur
niveau=0xD56C,0x3810
scene=0xD56C,0xD56C,0xD56C
; le depart de la partie : les vies 0x130BA passent de 255 (hors partie) a 2 (SHIP STOCK 3, reglage d'usine)
depart=0x130BA
depart_avant=0xFF
depart_valeur=2
mode=0x130BA
mode_valeur=2
; en partie : vies differentes de 255 (255 au demarrage, au choix du vaisseau, a l'ecran CONTINUE, au GAME OVER)
en_jeu=0x130BA
en_jeu_valeur=0
en_jeu_hors=0xFF
; (26/11, decision du user) LE CONTINUE : un depart du joueur est un continue quand l'horloge du jeu 0x130C4 (+1 par image en
; partie) et la distance du stage 0x130CA valent ce qu'elles valaient a sa sortie de partie (vies 255) ; le jeu est gele de la
; vie perdue sans reserve au depart suivant (ecran CONTINUE, choix du vaisseau). Une nouvelle partie part de 0x15E et 0x61 (le
; GAME OVER les remet a zero). Au continue les fantomes ne repartent pas ; ils sont en pause tant que le joueur est hors partie
; (banc du 26/11, replays c94c8a57, 65e83862, b753f4cd : 3 continues ; c94c8a57 et 56b8e60c suivis d'un GAME OVER puis d'une
; nouvelle partie).
reprise=0x130C4,0x130CA
pause_hors_jeu=1
; (26/11) la demo d'attraction : 0x3926 vaut 1 pendant chaque demo (ses vies passent de 255 a 2) ; ni depart ni partie
demo=0x3926
; (26/11, option A du user) le fantome s'arrete et disparait a la fin de la partie qui compte (le 1CC) : quand sa copie sort
; de partie apres son depart (ses vies passent a 255)
fin_a_la_sortie=1
; propres a FBNeo (meme section)
inverse=0
; le vaisseau : x 0x103E6, y 0x103E4 (1/64 de pixel, .VIEW du Deck) ; l'image du coeur est couchee (448 x 224) : son x est
; le y du jeu, son y le x du jeu ; centre du sprite du vaisseau = (y / 64, x / 64) dans l'image
pos_x=0x103E6
pos_y=0x103E4
pos_octets=2
pos_div=64
echange_xy=1
centre_dx=0
centre_dy=0
; les sprites du vaisseau dans la liste PGM : palette 0 (le corps 48 x 32 et ses deux options 32 x 16, mesure du 25/11)
sprites_pgm=1
palettes=0
rayon=40
; la couche 1 du PGM est le decor (eteinte : fond magenta) ; la couche 2 porte le texte ET les sprites de basse priorite
; (tout le jeu de DaiOuJou) : elle reste allumee
couches_eteintes=1
fond=0xFF00FF
vaisseau_premier_plan=1
