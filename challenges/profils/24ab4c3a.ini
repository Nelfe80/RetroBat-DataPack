; Profil du coeur hote genesis_plus_gx_ghosts pour Sonic The Hedgehog 2 (World), contenu crc32 24ab4c3a
; (md5 8e2c29a1e65111fe2078359e685e7943, sha1 14dd06fc3aa19a59a818ea1f6de150c9061b14d4, base de RetroArch).
; A poser dans <systeme>\nelfeplay\profils\24ab4c3a.ini (Data Pack : resources/challenges/profils/24ab4c3a.ini).
; Aucune recompilation : toutes ces cles existent dans le coeur de main (NelfePlay-Ghosts f242e78).
; Adresses du 68000 sans le $FF du haut (le coeur fait le ^ 1). Carte : desassemblage s2disasm de Sonic Retro
; (s2.constants.asm), la meme pour la Rev 0 et la Rev A (aucune condition de revision dans la memoire de travail).
; Mesures du banc a faire des que la ROM est la : depart, mort, arrivee, tuiles de Sonic.
[profil]
nom=Sonic The Hedgehog 2 (World)
; mode de jeu Game_Mode $F600 : 0x8C pendant le carton du niveau, 0x0C en jeu, 0x20 sequence de fin
mode=0xF600
en_jeu=0xF600
en_jeu_valeur=0x0C
; le depart du run : le mode passe de 0x8C (carton) a 0x0C (main au joueur, le chrono du jeu court des cette image)
depart=0xF600
depart_avant=0x8C
depart_valeur=0x0C
mode_valeur=0x0C
mode_panneau=0x8C
; zone Current_Zone $FE10 et acte Current_Act $FE11 : un changement rearme le depart (niveau suivant)
niveau=0xFE10,0xFE11
scene=0xFE10,0xFE11,0xFE10
; camera Camera_X_pos $EE00 et Camera_Y_pos $EE04 (mots, pixels ; Sonic 1 : $F700 / $F704)
camera_x=0xEE00
camera_y=0xEE04
; Sonic = MainCharacter $B000 (Sonic 1 : $D000) : x $B008, y $B00C, routine $B024 (6 = mort, 8 = disparu, 0xA = relance)
perso_x=0xB008
perso_y=0xB00C
perso_routine=0xB024
routine_mort=6
; arrivee (MASS RUN) : le chrono du jeu Update_HUD_timer $FE1E retombe a 0, au panneau touche ET au bouton de la capsule
; (banc du 06/11 : Emerald Hill 1 a 0:13.50, Emerald Hill 2 a 0:34.15) ; il est a 1 pendant tout le carton de l'etat et une
; mort ne le coupe pas. Control_Locked $F7CC ne convient pas : il vaut 1 pendant le carton (le GO recharge l'etat, arrivee
; fausse en 18 images au banc) et les actes a capsule ne le posent pas.
fin_d_acte=0xFE1E
fin_d_acte_valeur=0
; ou la sequence de fin (mode 0x20). Le Special Stage (0x10) N'EST PAS une arrivee : on y entre par un lampadaire.
modes_arrivee=0x20,0
; poses de MASS RUN : image mapping_frame $B01A et rendu render_flags $B001 (bit 0 : retourne)
perso_image=0xB01A
perso_rendu=0xB001
; tuiles de Sonic en memoire video : ArtTile_ArtUnc_Sonic = $0780 ; Tails commence a $07A0 (ArtTile_ArtUnc_Tails) et sa
; queue a $07B0 : on s'arrete a $07A0 pour ne jamais dessiner Tails dans un fantome ; palette 0
tuile_debut=0x780
tuile_fin=0x7A0
palette=0
