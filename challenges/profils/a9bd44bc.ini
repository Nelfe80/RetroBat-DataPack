; Profil du coeur hote fceumm_ghosts pour Mega Man 2 (USA), contenu crc32 a9bd44bc (le .nes entier, en-tete compris).
; A poser dans <systeme>\nelfeplay\profils\a9bd44bc.ini (Data Pack : resources/challenges/profils/a9bd44bc.ini).
; Il demande le coeur de la branche jour0611-mm2-ghosts de NelfePlay-Ghosts : cartouche a CHR-RAM (motifs lus dans l'etat
; de chaque copie), sprites du personnage reconnus a leur tuile et a leur place (l'OAM du jeu s'inverse une image sur deux),
; arrivee de MASS RUN a sa propre adresse. Un coeur plus ancien ignore ces cles et ne dessine rien.
; Mesures du banc fceumm sans fenetre du 06/11 (jour) ; noms des octets : desassemblage lsmmega/mm2 (ram/ram.asm).
[profil]
nom=Mega Man 2 (USA)
; la table des sprites : page $0200 ; miroir de $2000 : $00F7 (zppu_ctrl, $90 : sprites de 8 x 8 en $0000)
oam=0x0200
controle_ppu=0x00F7
; Mega Man = objet 0 : ecran $0440, x $0460, y $04A0 ; ses sprites ont les tuiles $00 a $7F (les ennemis $80 et plus)
perso_ecran=0x0440
perso_x=0x0460
perso_y=0x04A0
tuile_debut=0x00
tuile_fin=0x80
; camera : ecran $0020 (zscreen_id) et x $001F ; y $0022 pendant le defilement d'un ecran a l'autre (0 sinon)
camera_page=0x0020
camera_x=0x001F
camera_y=0x0022
; un passage d'un ecran a l'autre en defilant verticalement : deux ecrans voisins sont l'un sous l'autre (240 pixels)
ecran_vertical=240
; scene : le stage $002A (0 Heat Man a 7 Crash Man)
scene=0x002A,0x002A,0x002A
niveau=0x002A,0x002A
; (08/11) le meme jeu sans son en-tete (regle rcheevos) : le No-Intro "Mega Man 2 (USA)" (en-tete NES 2.0, crc32
; 80e08660) retrouve ce profil, ses fantomes et son MASS RUN sous le crc a9bd44bc. Un coeur d'avant le 08/11 ignore la cle.
crc_sans_en_tete=0x0fcfc04d
; depart du run : l'image de Mega Man $0400 passe de 0 (READY) a $1A (la teleportation), en Difficult ($00CB = 1)
depart=0x0400
depart_avant=0
depart_valeur=0x1A
mode=0x00CB
mode_valeur=1
en_jeu=0x00CB
en_jeu_valeur=1
; mort : les drapeaux de l'objet 0 ($0420, $C0 ou $80 en vie) sont decales a droite chaque image de l'animation de mort :
; $60 (tourne a droite) ou $40 (a gauche) a la premiere ; aussitot pour une chute, 16 images apres le coup fatal sinon
mort_adresse=0x0420
mort=0x60,0x40
; MASS RUN : arrivee a la defaite du boss ($00BD passe a 1 avec les PV du boss a 0, les huit stages) ; couleurs du sprite
; (palette 0 de Mega Man : 1 noir, 2 bleu clair, 3 bleu)
arrivee_adresse=0x00BD
arrivee_valeur=1
indice_principal=3
indice_peau=2
indice_sombre=1
