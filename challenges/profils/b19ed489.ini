; niveau $13BF (le pointeur $65 de la couche 1 sert aussi de memoire de travail : il change en cours de salle, banc du 06/11)
scene=0x1931,0x1925,0x13BF
; Mario dans le niveau ($94 x, $96 y, mots) ; camera = couche 1 ($1A x, $1C y)
perso_x=0x0094
perso_y=0x0096
camera_x=0x001A
