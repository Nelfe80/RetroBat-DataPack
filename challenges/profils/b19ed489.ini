; Profil du coeur hote snes9x_ghosts pour Super Mario World (USA), contenu crc32 b19ed489 (le .sfc entier, md5 cdd3c8c3...).
; A poser dans <systeme>\nelfeplay\profils\b19ed489.ini (Data Pack : resources/challenges/profils/b19ed489.ini).
; Il demande le coeur de la branche jour0611-snes-fantomes de NelfePlay-Ghosts (cles boite, couleurs, mort_max, palette 0) :
; un coeur plus ancien lit les adresses de Super Metroid pour le dessin. Mesures du banc snes9x sans fenetre du 06/11 (jour).
[profil]
nom=Super Mario World (USA)
; mode de jeu $0100 : 0x13 ouverture du niveau, 0x14 en jeu (aussi en pause et pendant « COURSE CLEAR ! »)
mode=0x0100
mode_valeur=0x14
en_jeu=0x0100
en_jeu_valeur=0x14
depart=0x0100
depart_avant=0x13
depart_valeur=0x14
