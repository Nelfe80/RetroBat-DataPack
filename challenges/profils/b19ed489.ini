; palette) : 3 cheveux et moustache, 4 5 6 peau (couleurs vues 17,11,3 / 27,20,7 / 31,27,14 / 31,26,24)
peau=3,4,5,6
; mort : $0071 (animation du joueur) = 9
perso_routine=0x0071
routine_mort=9
mort_max=9
; (13/11, MASS RUN) le chrono du niveau ($0F31-$0F33, centaines, dizaines, unites) fige en salle d attente a sa valeur du depart
; (coeur snes9x_ghosts du 13/11 ; un coeur plus ancien ignore la cle)
chrono=0x0F31,0x0F32,0x0F33
