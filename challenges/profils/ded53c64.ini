; Profil du coeur hote snes9x_ghosts pour Mega Man X (USA) (Rev 1), contenu crc32 ded53c64 (le .sfc entier, md5 df1cc0c8...).
; A poser dans <systeme>\nelfeplay\profils\ded53c64.ini (Data Pack : challenges/profils/ded53c64.ini). Mesures du banc
; snes9x sans fenetre du 11/11 (etats d'entree des huit stages des Mavericks).
[profil]
nom=Mega Man X (USA) (Rev 1)
; mode de la partie $00D2 : 0x02 chargement, 0x04 stage en cours (aussi pendant READY), 0x0A apres une mort
mode=0x00D2
mode_valeur=0x04
en_jeu=0x00D2
en_jeu_valeur=0x04
; depart : l'etat de X $0BAA passe de 0x22 (descente en rayon) a 0 (X se pose, la main au joueur)
depart=0x0BAA
depart_avant=0x22
depart_valeur=0x00
niveau=0x1F7A,0x1F7A
; scene : le stage $1F7A (les coordonnees de X et de la camera sont celles du stage entier, d'un point de reprise a l'autre)
scene=0x1F7A,0x1F7A,0x1F7A
; X dans le stage ($0BAD x, $0BB0 y, mots) ; camera ($00B4 x, $00B6 y, mots) : X debout occupe x-14 a x+16 et y-18 a y+16
perso_x=0x0BAD
perso_y=0x0BB0
camera_x=0x00B4
camera_y=0x00B6
; fantome : decoupe de x-24 a x+24 et de y-30 a y+18 (glissade et saut compris)
boite=-24,24,-30,18
; mort : $0BAA = 0x0C
perso_routine=0x0BAA
routine_mort=0x0C
mort_max=0x0C
; premier plan : le tampon OAM du jeu en $0700 (table haute en $0900), X = palette de sprites 1, motifs en VRAM $6000 (OBSEL,
; valeur par defaut du coeur) ; mesure du 11/11 (oam_perso.py : masque des motifs = masque de l'image sans decor, debout,
; en course, en saut et en tir ; le tir du buster est en palette 0)
oam=0x0700
palette=1
